global:
  scrape_interval: 5s # Coleta dados do código a cada 5 segundos

scrape_configs:
  - job_name: 'graphql-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway-service:8000']

  - job_name: 'produtos-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['produtos-service:8002']

  - job_name: 'usuarios-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['usuarios-service:8001']

  - job_name: 'pedidos-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['pedidos-service:8003']